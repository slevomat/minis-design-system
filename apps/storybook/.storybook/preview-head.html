<!-- Load Base Tokens (Layout, Breakpoints) -->
<link rel="stylesheet" href="../../../packages/tokens/dist/layout.css">
<link rel="stylesheet" href="../../../packages/tokens/dist/breakpoints.css">

<!-- Load Foundation (theme will be switched dynamically) -->
<link rel="stylesheet" href="../../../packages/tokens/dist/foundation/light.css" id="foundation-theme">

<script>
  // Theme switcher logic
  const channel = window.__STORYBOOK_ADDONS_CHANNEL__;
  
  if (channel) {
    channel.on('updateGlobals', ({ globals }) => {
      const theme = globals.theme || 'light';
      const themeLink = document.getElementById('foundation-theme');
      
      if (themeLink) {
        themeLink.href = `../../../packages/tokens/dist/foundation/${theme}.css`;
      }
      
      document.documentElement.setAttribute('data-theme', theme);
    });
  }
</script>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: var(--color-background, #ffffff);
    color: var(--color-text-primary, #000000);
  }
</style>
